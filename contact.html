<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="contact-content">
                <h1 class="mb-4">Contact me</h1>

                <!--<hr class="my-5">-->

                <!-- Contact Info -->
                <div class="row mb-5">
                    <div class="col-md-6 mb-4">
                        <h3><i class="bi bi-envelope me-2 text-primary"></i> Email</h3>
                        <p>
                            <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
                        </p>
                    </div>
                    <!--<div class="col-md-6 mb-4">

                </div>

                <!-- Social Links -->
                <div class="mb-5">
                    <h3 class="mb-3">Find me</h3>
                    <div class="d-flex gap-3 flex-wrap">
                        {% if site.social.github %}
                        <a href="{{ site.social.github }}" target="_blank" rel="noopener" class="btn btn-outline-primary">
                            <i class="bi bi-github me-2"></i> GitHub
                        </a>
                        {% endif %}
                        {% if site.social.linkedin %}
                        <a href="{{ site.social.linkedin }}" target="_blank" rel="noopener" class="btn btn-outline-primary">
                            <i class="bi bi-linkedin me-2"></i> LinkedIn
                        </a>
                        {% endif %}
                        {% if site.social.twitter %}
                        <a href="https://twitter.com/{{ site.social.twitter }}" target="_blank" rel="noopener" class="btn btn-outline-primary">
                            <i class="bi bi-twitter me-2"></i> Twitter
                        </a>
                        {% endif %}
                    </div>
                </div>
